name: Compile AltumStamp Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Custom App Launcher Icons from SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          
          # Remove default template adaptive XMLs so Android displays the custom full-bleed logo
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          
          MIPMAP="android/app/src/main/res"
          
          # Convert logo.svg to all standard Android mipmap densities
          rsvg-convert -w 48 -h 48 public/logo.svg -o $MIPMAP/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 48 -h 48 public/logo.svg -o $MIPMAP/mipmap-mdpi/ic_launcher_round.png
          
          rsvg-convert -w 72 -h 72 public/logo.svg -o $MIPMAP/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 public/logo.svg -o $MIPMAP/mipmap-hdpi/ic_launcher_round.png
          
          rsvg-convert -w 96 -h 96 public/logo.svg -o $MIPMAP/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 public/logo.svg -o $MIPMAP/mipmap-xhdpi/ic_launcher_round.png
          
          rsvg-convert -w 144 -h 144 public/logo.svg -o $MIPMAP/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 public/logo.svg -o $MIPMAP/mipmap-xxhdpi/ic_launcher_round.png
          
          rsvg-convert -w 192 -h 192 public/logo.svg -o $MIPMAP/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 public/logo.svg -o $MIPMAP/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Compile Native Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload AltumStamp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltumStamp-Production-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
